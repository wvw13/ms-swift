[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funembed-eval"
version = "0.2.0"
description = "Protocol-explicit ophthalmic embedding retrieval evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
funembed-eval = "funembed_eval.__main__:main"

[tool.setuptools.packages.find]
include = ["funembed_eval*"]
